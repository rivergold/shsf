services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shsf
      POSTGRES_USER: shsf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shsf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shsf -d shsf"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shsf-postgres:
